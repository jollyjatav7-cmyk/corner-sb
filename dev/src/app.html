<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="角球数据">
<meta name="theme-color" content="#2F6C4B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>角球数据记录</title>
<style>
:root{
  --paper:#E6EAE5; --raise:#F5F7F4; --ink:#14201A; --ink2:#46544C; --muted:#748178; --rule:#C8D0CA;
  --grass:#2F6C4B; --grass2:#2B6445; --grass-deep:#245A3D; --chalk:#F3F5EE; --chalk2:rgba(243,245,238,.62); --line:rgba(243,245,238,.72);
  --flag:#F2C230; --on-flag:#2A2100; --home:#2A58D3; --away:#CF4229; --warn:#B3261E; --scrim:rgba(8,14,10,.45);
  --faint:#A3AEA7; --home-soft:#DCE5FA; --away-soft:#F8E1DB; --red:#D93025;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-num:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101613; --raise:#18201C; --ink:#E4EAE5; --ink2:#AFBAB3; --muted:#7F8C85; --rule:#28322D;
  --grass:#245A3D; --grass2:#215437; --grass-deep:#1C4A31; --home:#86A9FF; --away:#FF8E72; --scrim:rgba(0,0,0,.6);
  --faint:#56625B; --home-soft:#1A2644; --away-soft:#3A2018; --red:#FF5A4E;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
input{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- 计分列 ---------- */
.app{min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:10px 16px 8px}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta input{border:0;background:none;padding:0;font-weight:600;font-size:15px;min-width:0;width:100%}
.meta input::placeholder{color:var(--muted)}
.meta .sub{font-size:12px;color:var(--muted)}
.score{display:grid;grid-template-columns:minmax(0,9em) auto auto auto minmax(0,9em);align-items:center;gap:10px}
.tn{display:flex;flex-direction:column;min-width:0}
.tn.h{align-items:flex-end;text-align:right} .tn.a{align-items:flex-start}
.tn input{border:0;background:none;padding:0;font-weight:700;font-size:17px;width:100%;text-overflow:ellipsis}
.tn.h input{text-align:right;color:var(--home)} .tn.a input{color:var(--away)}
.tn input::placeholder{color:inherit;opacity:.55}
.tn small{font-size:12px;color:var(--muted)}
.cks{border:0;background:none;padding:3px 0;font-size:12px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
button.gl{border:0;background:none;padding:0 3px;border-radius:8px}
button.gl:active,.cks:active{background:var(--rule)}
.gl{font-size:40px;line-height:1;font-weight:600;min-width:.7em;text-align:center}
.gl.h{color:var(--home)} .gl.a{color:var(--away)}
.clk{display:flex;align-items:center;gap:8px}
.clkbtn{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.clkbtn span{font-size:12px;color:var(--muted);line-height:1}
.clkbtn b{font:600 34px/1.05 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clk.idle .clkbtn b{color:var(--muted)}
.run{width:40px;height:40px;border-radius:20px;border:0;background:var(--grass);color:var(--chalk);display:grid;place-items:center}
.run.on{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.run svg{width:16px;height:16px}
.bar .tools{justify-self:end;display:flex;gap:4px}
.tbtn{height:36px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink2);font-weight:500}
.tbtn:active{background:var(--rule)}

/* ---------- 主区 ---------- */
/* ---------- 时间轴（沿用 corner-log 的画法） ---------- */
.tl{padding:0 16px 8px}
.tl-head{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px}
.tl-cap{margin:0;font-size:13px;font-weight:700;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--muted);flex:1 1 300px;min-width:0}
.legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.legend svg{width:15px;height:15px;overflow:visible;flex:none}
.tl-tools{display:flex;align-items:center;gap:2px;margin-left:auto;flex-wrap:wrap}
.zoom{display:inline-flex;align-items:center}
.zb{min-width:32px;height:30px;border:0;background:none;border-radius:8px;font:500 17px/1 var(--f-ui);color:var(--ink2);padding:0 6px}
.zb:active{background:var(--rule)}
.zb.t{font-size:12.5px}
.zb[aria-pressed="true"]{background:var(--rule);color:var(--ink)}
.zb:disabled{opacity:.35}
.zl{font-size:11.5px;color:var(--muted);min-width:6.5em;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:none;order:5;flex-basis:100%}
.legend.open{display:flex}
.legend svg.w2{width:24px} .legend svg.w3{width:36px}
.tl-wrap{position:relative;min-width:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab;margin-top:2px;background:var(--raise);border-radius:12px}
.tl-wrap.drag{cursor:grabbing}
.tl.fold .tl-wrap,.tl.fold .legend,.tl.fold .zoom,.tl.fold #curveBtn,.tl.fold .lgdbtn{display:none}
#tl{display:block;width:100%}
#tl text{font-family:var(--f-ui)}
.tl .ax{stroke:var(--muted);stroke-width:1.2} .tl .ax.st2{stroke-dasharray:4 3}
.tl .gd{stroke:var(--rule);stroke-width:1} .tl .mt{stroke:var(--faint);stroke-width:1}
.tl .tk{fill:var(--muted);font-size:10.5px;text-anchor:middle;font-variant-numeric:tabular-nums} .tl .tk.ht{font-weight:700;letter-spacing:.08em}
.tl .sd{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:middle} .tl .sd.home{fill:var(--home)} .tl .sd.away{fill:var(--away)}
.tl .uw{fill:var(--rule);opacity:.45} .tl .uwl{fill:var(--muted);font-size:11px;text-anchor:middle}
.tl .mo.home{fill:var(--home);opacity:.12} .tl .mo.away{fill:var(--away);opacity:.12}
.tl .mi.home{fill:var(--home);opacity:.3} .tl .mi.away{fill:var(--away);opacity:.3}
.tl .sm{stroke-linecap:round} .tl .sm.home{stroke:var(--home)} .tl .sm.away{stroke:var(--away)}
.tl .sm.s0{stroke-width:1.1;opacity:.35} .tl .sm.s1{stroke-width:1.4;opacity:.6} .tl .sm.s2{stroke-width:2.6} .tl .sm.s3{stroke-width:2.2} .tl .sm.s4{stroke-width:3}
.tl .sm.au{stroke-dasharray:3 2}
.tl .ckb{stroke:var(--flag);stroke-width:9;stroke-linecap:round;opacity:.4}
.tl .hd.home.l1{fill:var(--home);opacity:.5} .tl .hd.away.l1{fill:var(--away);opacity:.5}
.tl .hd.home.l1b{fill:var(--home);opacity:.75} .tl .hd.away.l1b{fill:var(--away);opacity:.75}
.tl .hd.home.l2{fill:var(--home)} .tl .hd.away.l2{fill:var(--away)} .tl .hd.l2{stroke:var(--raise);stroke-width:1.2}
.tl .hd.l0{fill:var(--raise);stroke-width:1.8} .tl .hd.home.l0{stroke:var(--home)} .tl .hd.away.l0{stroke:var(--away)}
.tl .hd.cr.l0{stroke-width:2.4}
.tl .wall{stroke-width:2.2;stroke-linecap:round} .tl .wall.home{stroke:var(--home)} .tl .wall.away{stroke:var(--away)}
.tl .fl{fill:var(--flag);stroke-width:1.4;stroke-linejoin:round} .tl .fl.home{stroke:var(--home)} .tl .fl.away{stroke:var(--away)}
.tl .bl{fill:var(--raise);stroke:var(--ink);stroke-width:1.5} .tl .bc{fill:var(--ink)}
.tl .rcd{fill:var(--red)}
.tl .nw{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3;opacity:.45}
.tl .em{fill:var(--muted);font-size:13px;text-anchor:middle}
@media (max-width:599px){
  .tl{padding:0 10px 6px}
  .zl{display:none}
}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,350px) minmax(0,1fr);grid-template-areas:"home mid away";gap:14px;padding:4px 16px 84px;align-items:start}
.pad[data-i="0"]{grid-area:home} .pad[data-i="1"]{grid-area:away} .mid{grid-area:mid}
@media (max-width:899px){
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"home away" "mid mid";gap:10px;padding:4px 10px 84px}
  .main .mid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px 28px;align-items:start;padding-top:6px}
  .bar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"meta tools" "score score";padding:8px 10px 6px;row-gap:4px}
  .bar .meta{grid-area:meta;flex-direction:row;align-items:baseline;gap:10px}
  .bar .meta input{width:auto;flex:1}
  .bar .tools{grid-area:tools}
  .score{grid-area:score;justify-self:stretch;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr)}
}
@media (max-width:599px){
  .score{gap:6px}
  .pad-h [data-tot]{display:none}
  .bar .tools .tbtn{height:32px}
  .gl{font-size:30px}
  .clkbtn b{font-size:26px}
  .run{width:34px;height:34px}
  .tn input{font-size:15px}
  .bar .tools .tbtn{padding:0 8px}
}

/* ---------- 球场按键区 ---------- */
.pad{container-type:inline-size;min-width:0}
.pad-h{display:flex;align-items:baseline;gap:8px;padding:2px 2px 8px;font-size:14px}
.pad-h i{width:9px;height:9px;border-radius:50%;display:inline-block;align-self:center}
.pad[data-i="0"] .pad-h i{background:var(--home)} .pad[data-i="1"] .pad-h i{background:var(--away)}
.pad-h b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad[data-i="0"] .pad-h b{color:var(--home)} .pad[data-i="1"] .pad-h b{color:var(--away)}
.pad-h span{color:var(--muted);font-size:13px;white-space:nowrap}
.pitch{position:relative;border-radius:16px;overflow:hidden;color:var(--chalk);
  background:repeating-linear-gradient(180deg,var(--grass) 0 56px,var(--grass2) 56px 112px);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.3fr) minmax(0,1fr);
  grid-template-areas:"goal goal goal" "ckl box ckr" "wl box wr" "f3 f3 f3" "ex ex ex";
  grid-template-rows:auto 52px auto 116px auto;padding:10px 10px 0}
.pitch::before{content:"";position:absolute;inset:10px 10px auto 10px;height:calc(100% - 10px);border:2px solid var(--line);border-radius:3px 3px 0 0;pointer-events:none}
.z{position:relative;border:0;background:none;color:var(--chalk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:6px 4px;border-radius:10px;z-index:1}
.z:active{background:rgba(243,245,238,.16)}
.z .l{font-size:15px;font-weight:600;line-height:1.2;text-align:center}
.z .s{font-size:12px;color:var(--chalk2);line-height:1.2;text-align:center}
.z .c{font:600 22px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--chalk2)}
.z.hit{animation:hit .5s ease-out}
@keyframes hit{0%{background:rgba(243,245,238,.55)}100%{background:rgba(243,245,238,0)}}
@media (prefers-reduced-motion:reduce){.z.hit{animation:none;background:rgba(243,245,238,.3)}}
.goalrow{grid-area:goal;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px 6px 8px;position:relative}
.goalrow::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:10px;border:2px solid var(--line);border-bottom:0}
.goalrow .z{min-height:56px;background:rgba(0,0,0,.12)}
.goalrow .z.sg{background:var(--chalk);color:var(--grass-deep)}
.goalrow .z.sg .c,.goalrow .z.sg .s{color:var(--grass-deep)}
.box{grid-area:box;margin:0 2px;border:2px solid var(--line);border-top:0;border-radius:0 0 4px 4px}
.box .l{font-size:18px}
.box .c{font-size:30px}
.ck{color:var(--flag)}
.ck .l{color:var(--flag)} .ck .c{color:var(--flag)}
.ck svg{width:18px;height:18px}
.ckl{grid-area:ckl;justify-self:start;width:100%} .ckr{grid-area:ckr;justify-self:end;width:100%}
.wing{display:flex;flex-direction:column;gap:4px;padding:4px 0}
.wl{grid-area:wl} .wr{grid-area:wr}
.wing .z{flex:1;min-height:62px;background:rgba(0,0,0,.1)}
.f3{grid-area:f3;margin-top:8px;border-bottom:2px dashed var(--line);border-radius:10px 10px 0 0}
.f3 .l{font-size:19px} .f3 .c{font-size:30px}
.f3 .tag{position:absolute;right:8px;bottom:6px;font-size:11px;color:var(--chalk2)}
.extra{grid-area:ex;display:flex;justify-content:center;gap:8px;padding:9px 6px 11px;position:relative}
.extra::before{content:"";position:absolute;left:50%;bottom:-46px;width:92px;height:92px;margin-left:-46px;border:2px solid var(--line);border-radius:50%;pointer-events:none}
.extra .z{flex:0 1 auto;flex-direction:row;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:18px;background:var(--grass-deep)}
.extra .z .l{font-size:13px;font-weight:500}
.extra .z .c{font-size:16px}
.extra .z{white-space:nowrap}
/* 横放、屏幕比较矮的 iPad：压缩球场，让整块球场不用滚动就看得到 */
@media (min-width:900px) and (max-width:1100px){
  .main{grid-template-columns:minmax(332px,1fr) minmax(270px,1fr) minmax(332px,1fr)}
}
@media (min-width:900px) and (max-height:860px){
  .bar{padding:6px 16px 4px}
  .pad-h{padding-bottom:4px}
  .pitch{grid-template-rows:auto 44px auto 90px auto;padding:8px 8px 0}
  .pitch::before{inset:8px 8px auto 8px}
  .goalrow .z{min-height:46px}
  .goalrow{padding:2px 6px 6px}
  .wing .z{min-height:48px}
  .f3{margin-top:4px}
  .extra{padding:6px 6px 8px}
  .extra .z{padding:6px 12px}
  .tl{padding-bottom:4px}
}
@container (max-width:330px){
  .pitch{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"goal goal" "box box" "wl wl" "f3 f3" "ckl ckl" "ex ex";grid-template-rows:auto 76px auto 104px 54px auto;padding:6px 6px 0}
  .pitch::before{inset:6px 6px auto 6px}
  .goalrow{grid-template-columns:repeat(2,minmax(0,1fr));padding:2px 2px 6px}
  .goalrow .z{min-height:46px}
  .goalrow::after{display:none}
  .ckr,.wr{display:none}
  .wl{flex-direction:row}
  .wing .z{min-height:56px}
  .box{margin:0;border-top:2px solid var(--line);border-radius:4px}
  .box .l{font-size:16px} .box .c{font-size:24px}
  .f3 .l{font-size:16px} .f3 .c{font-size:24px}
  .f3 .tag{display:none}
  .z .l{font-size:14px}
  .extra{padding:10px 2px 12px;gap:4px}
  .extra .z{padding:6px 10px}
  .extra .pre{display:none}
  .extra::before{width:70px;height:70px;margin-left:-35px;bottom:-35px}
}

/* ---------- 中间：预测与统计 ---------- */
.mid{min-width:0;display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
.sec-h h2{margin:0;font-size:15px;font-weight:700}
.sec-h .sp{flex:1}
.sec-h small{font-size:12.5px;color:var(--muted)}
.sec-h small b{font:600 15px var(--f-num)} .sec-h small .h{color:var(--home)} .sec-h small .a{color:var(--away)}
.pred-top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{background:var(--raise);border-radius:14px;padding:10px 12px 8px;display:flex;flex-direction:column}
.pv b{font:600 46px/1 var(--f-num);font-variant-numeric:tabular-nums}
.pv span{font-size:13px;color:var(--ink2);margin-top:2px}
.pv.over{background:var(--flag);color:var(--on-flag)} .pv.over span{color:var(--on-flag)}
.pred-line{margin:10px 0 0;font-size:13.5px;color:var(--ink2)}
.pred-line b{font:600 17px var(--f-num);color:var(--ink)}
.dist{margin-top:10px;position:relative;max-width:440px}
.dist svg{display:block;width:100%;height:auto}
.dist .tk{font:500 11px var(--f-ui);fill:var(--muted)}
.dist .pl{font:600 11px var(--f-num);fill:var(--ink2)}
.lines{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.lines b{font:600 14px var(--f-num);color:var(--ink2);margin-left:4px}
.lines .on b{color:var(--ink)}
.factor{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:12px;font-size:13px}
.factor .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:8em}
.factor .nm.h{color:var(--home)} .factor .nm.a{color:var(--away)}
.factor .bar2{height:6px;border-radius:3px;background:var(--rule);position:relative;overflow:hidden}
.factor .bar2 i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--ink2)}
.factor .bar2::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.factor .v{font:600 15px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;min-width:3.4em}
.ctls{display:grid;gap:6px;margin-top:12px}
.ctl{display:grid;grid-template-columns:1fr 34px 4.2em 34px 2.8em;align-items:center;gap:4px;font-size:13.5px;color:var(--ink2)}
.ctl>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl.c6{grid-template-columns:1fr 34px 4.2em 34px 2.8em 3.4em}
.ctl button{height:34px;border:0;border-radius:17px;background:var(--raise);font-size:17px;font-weight:600;box-shadow:inset 0 0 0 1px var(--rule)}
.ctl button:active{background:var(--rule)}
.ctl b{text-align:center;font:600 16px var(--f-num);color:var(--ink)}
.ctl .x{background:none;box-shadow:none;font-size:12px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0;white-space:nowrap}
.note{font-size:12px;line-height:1.5;color:var(--muted);margin:10px 0 0}
.msg{font-size:13.5px;color:var(--ink2);margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:6px 0;border-top:1px solid var(--rule)}
.tbl td.n{font:600 19px/1 var(--f-num);font-variant-numeric:tabular-nums;width:3em}
.tbl td.n.h{color:var(--home)} .tbl td.n.a{color:var(--away);text-align:right}
.tbl td.m{text-align:center}
.tbl td.m small{display:block;font-size:11.5px;color:var(--muted)}
.src{font-size:11px;color:var(--muted);margin:0}
.sec-h.ph{flex-wrap:wrap;align-items:center;row-gap:6px}
.seg{display:inline-flex;background:var(--paper);border-radius:10px;padding:2px;box-shadow:inset 0 0 0 1px var(--rule)}
.seg button{border:0;background:none;height:30px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fixb{border:0;background:none;height:30px;padding:0 4px;font-size:12.5px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.sub2{margin:-2px 0 8px;font-size:12.5px;color:var(--muted)}
.sub2 b{font:600 15px var(--f-num)} .sub2 .h{color:var(--home)} .sub2 .a{color:var(--away)}
.lnc{margin-top:8px}
.lnh{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.lnr{display:flex;gap:4px;align-items:center}

small.auto{font-size:10.5px;color:var(--grass);margin-left:4px;font-weight:600}

/* ================= 新排版：iPad 三栏整理（方案 A）、手机全屏球场（方案 C） ================= */
:root{--paper:#F1F3EF;--card:#FFFFFF;--line2:#E3E7E2;--tile:rgba(255,255,255,.07);--pitch:#24573D;--ok:#2F8A57}
@media (prefers-color-scheme:dark){:root{--paper:#101613;--card:#18201C;--line2:#28322D;--pitch:#1E4A33;--ok:#5CC08A}}
body{background:var(--paper)}
/* 比分列 */
.bar .tools{align-items:center;gap:6px}
.tbtn.ic{width:40px;padding:0;display:grid;place-items:center}
.netpill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:var(--card);border:1px solid var(--line2);font-size:12px;color:var(--ink2);white-space:nowrap;max-width:15em;overflow:hidden}
.netpill[hidden]{display:none}
.netpill i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.netpill.off i{background:var(--faint)}
.netpill.bad{color:var(--warn);border-color:var(--warn)} .netpill.bad i{background:var(--warn)}
.netpill svg{width:14px;height:14px;flex:none}
.netpill span{overflow:hidden;text-overflow:ellipsis}
.netpill.sync{color:var(--ink)}
.menu .mdefs{display:none}
.toast{left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 24px);transform:none}
#toastMsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* 时间轴放进卡片，工具列缩小 */
.tl{padding:0 20px 0}
.tl-card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:2px 10px 2px}
.tl-head{min-height:28px}
.tl-cap{font-size:12px;color:var(--muted);font-weight:600}
.tl-wrap{background:none;margin-top:0;border-radius:0}
.tl .zb{height:26px}
#tlMore{display:none}
/* 球场：平面色块 */
.pitch{background:var(--pitch);padding:10px;gap:6px;border-radius:18px}
.pitch::before{display:none}
.z{background:var(--tile)}
.z:active{background:rgba(243,245,238,.2)}
.goalrow{padding:0;gap:6px}

.goalrow .z{background:var(--tile)}
.goalrow .z.sg{background:var(--chalk)}
.box{margin:0;border:2px solid rgba(243,245,238,.35);border-radius:10px}
.ck{flex-direction:row;gap:6px}
.ck .l{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.ck{gap:4px;padding:4px 3px}
.ck svg{flex:none}
.wing{padding:0;gap:6px}
.wing .z{background:var(--tile)}
.f3{margin-top:0;border-bottom:2px dashed rgba(243,245,238,.45);border-radius:10px 10px 4px 4px}
.extra{padding:0}
.extra::before{display:none}

@media (min-width:900px) and (max-height:860px){.pitch{padding:8px;gap:5px}}
/* 球场上方的撤销 */
.pad-h{align-items:center}
.pad-h .undo{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}

.pad-h .undo:disabled{opacity:.35}

/* 中间卡片：分页 */
.main{padding:12px 20px 76px}
.main .mid{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:12px 14px;gap:10px}

.morebtn{border:0;border-top:1px solid var(--rule);background:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 2px;font-size:12.5px;color:var(--ink2);width:100%;text-align:left}

}
@media (max-width:899px){

}

  if (netBusy || !NET.key) { if (manual && !NET.key) openSheet('net'); return; }
  const h = M.h.trim(), a = M.a.trim();
  if (!h || !a){ if (manual) showToast('先输入主队和客队名字'); return; }
  netBusy = true; renderPred();
  const id = M.id;
  try {
    await Promise.all([wdPrep(h), wdPrep(a)]);
    if (Date.now() - netList.at > 120000) netList = { at: Date.now(), list: await apiGet('/fixtures?live=all') || [], day: false };
    let r = rankFixtures(netList.list, h, a);
    if (!isSure(r) && !netList.day){
      const day = await apiGet(`/fixtures?date=${dayKey(new Date())}&timezone=${encodeURIComponent(TZ)}`) || [];
      const seen = new Set(netList.list.map(f => f.fixture.id));
      netList.list = netList.list.concat(day.filter(f => f && f.fixture && !seen.has(f.fixture.id))); netList.day = true;
      r = rankFixtures(netList.list, h, a);
    }
    if (M.id !== id) return;
    if (isSure(r)){ netBusy = false; closeSugg(); await apiLink(r[0]); return; }
    if (r.length || manual) openSugg(r.slice(0, 8));
    else M.apiErr = '今天的比赛里没找到这两队，可以按“查找”手动选';
  } catch(e){
    if (manual) showToast('联网查找失败：' + e.message); else M.apiErr = '联网查找失败：' + e.message;
  } finally { netBusy = false; renderPred(); }
}

async function apiLink(c){
  const f = c.f, H = f.teams.home, A = f.teams.away;
  M.api = { id: f.fixture.id, h: H.name, a: A.name, hid: H.id, aid: A.id, lg: f.league ? f.league.name : '', sw: c.sw ? 1 : 0, at: 0 };

  const mine = c.sw ? [A, H] : [H, A];

const isRecording = () => !!(observed(M).length || M.tm.r || M.tm.b);
function parseFix(f, m){
  const sw = m.api.sw, ids = sw ? [f.teams.away.id, f.teams.home.id] : [f.teams.home.id, f.teams.away.id];
  const st = (f.fixture && f.fixture.status) || {};
  const gl = f.goals || {}, g = sw ? [gl.away, gl.home] : [gl.home, gl.away];
  const num = v => v == null ? null : (parseInt(v, 10) || 0);
  const stat = (arr, id, type) => { const t = (arr || []).find(x => x && x.team && x.team.id === id); if (!t) return null; const s = (t.statistics || []).find(x => x.type === type); return s ? num(s.value) ?? 0 : 0; };
  const has = Array.isArray(f.statistics) && f.statistics.length >= 2;
  const ck = has ? ids.map(id => stat(f.statistics, id, 'Corner Kicks')) : null;
  let rc = has ? ids.map(id => stat(f.statistics, id, 'Red Cards')) : null;
  if (!rc || rc.some(x => x == null)) rc = ids.map(id => (f.events || []).filter(e => e && e.type === 'Card' && e.team && e.team.id === id && /red|second yellow/i.test(e.detail || '')).length);
  // 射门：被扑＝射正减进球；偏出、被挡直接用
  const sv = (id, type) => stat(f.statistics, id, type) || 0;
  const sh = has ? ids.map((id, j) => ({ ss: Math.max(0, sv(id, 'Shots on Goal') - (num(g[j]) || 0)), so: sv(id, 'Shots off Goal'), sb: sv(id, 'Blocked Shots') })) : null;
  const per = f.fixture && f.fixture.periods ? { first: num(f.fixture.periods.first), second: num(f.fixture.periods.second) } : null;
  return { st: st.short || '', el: num(st.elapsed) || 0, ex: num(st.extra) || 0, g: g.map(x => num(x) || 0), ck: ck && ck.every(x => x != null) ? ck : null, rc, sh, per, at: nowSec() };
}
async function apiFetch(m){
  const res = await apiGet(`/fixtures?id=${m.api.id}`);
  const f = res && res[0];
  if (!f) throw new Error('找不到这场比赛的资料');
  const s = parseFix(f, m);
  if (!s.ck && (LIVE_ST.includes(s.st) || DONE_ST.includes(s.st))){
    const st = await apiGet(`/fixtures/statistics?fixture=${m.api.id}`);
    const t = parseFix(Object.assign({}, f, { statistics: st }), m);
    s.ck = t.ck; s.sh = t.sh;
  }
  return s;
}
/* 上半场各几个角球（需要 API 有分半场的统计；没有就回传 null） */
async function apiHalf(m){
  const res = await apiGet(`/fixtures/statistics?fixture=${m.api.id}&half=true`);
  const ids = m.api.sw ? [m.api.aid, m.api.hid] : [m.api.hid, m.api.aid];
  const out = ids.map(id => {
    const t = (res || []).find(x => x && x.team && x.team.id === id);
    const arr = t && (t.statistics_1h || t.statistics_first_half);
    if (!Array.isArray(arr)) return null;
    const s = arr.find(x => x.type === 'Corner Kicks');
    return s ? (parseInt(s.value, 10) || 0) : 0;
  });
  return out.every(x => x != null) ? out : null;
}
/* 实时的比赛时间：API 有每个半场开球的时间戳就精确到秒；没有就用“第 67 分钟”= 66:00–66:59 取中间，再加上距离上次读取过了多久 */
function apiClock(s, now){
  now = now == null ? nowSec() : now;
  const per = s.per || {}, gone = Math.max(0, now - (s.at || now));
  if (s.st === '1H' && per.first && now - per.first > 0 && now - per.first < 4500) return { p: 1, v: clamp(now - per.first, 0, TPR[1][1]), exact: true };
  if (s.st === '2H' && per.second && now - per.second > 0 && now - per.second < 4500) return { p: 2, v: clamp(PER[2][0] + now - per.second, PER[2][0], TPR[2][1]), exact: true };
  const m = s.el + (s.ex || 0);
  if (s.st === '1H') return { p: 1, v: clamp((m - 1) * 60 + 30 + gone, 0, TPR[1][1]) };
  if (s.st === '2H') return { p: 2, v: clamp((m - 1) * 60 + 30 + gone, PER[2][0], TPR[2][1]) };
  if (s.st === 'HT') return { p: 1, v: PER[1][1], ht: true };
  return null;
}
/* 画面延迟：你看的画面比实时慢几秒。开球、中途加入或对时的时候，用联网的实时时间减去 app 的时间自动测出来，存在这台设备上，下次中途加入会自动扣掉 */
function fmtDelay(sec){ sec = Math.round(Math.abs(sec)); return sec >= 60 ? `${Math.floor(sec / 60)} 分 ${pad2(sec % 60)} 秒` : `${sec} 秒`; }
function learnDelay(appSec, why){
  const a = M.api;
  if (!a || !a.st || nowSec() - (a.at || 0) > 900) return;
  const r = apiClock(a);
  if (!r || r.ht || r.p !== (M.tm.ht ? 1 : M.tm.p)) return;
  if (!r.exact && why === 'kick') return;
  let d = Math.round(r.v - appSec);
  if (d < -45 || d > 900) return;
  if (!r.exact && d < 30) d = 0;  // 只知道联网的分钟数时，差 30 秒以内分不出来，当作没有延迟
  a.dl = Math.max(0, d); NET.delay = a.dl; saveNet();
}
const myDelay = () => M.api && M.api.dl != null ? M.api.dl : NET.delay;
async function openJoinFromApi(s){

  if (ck1) M.api.ck1 = ck1.slice();
  if (s.ck && c && c.p === 1) M.api.ck1 = null;
  M.api.base = s.sh ? s.sh.map(x => Object.assign({}, x)) : null;  // 加入前的射门不补，只补之后的
  // 先扣掉你上次测出的画面延迟，跟画面对一下就能开始
  const dl = NET.delay || 0;

}
function applySnap(s){
  const a = M.api; a.at = s.at || nowSec(); a.st = s.st; a.el = s.el; a.ex = s.ex; a.g = s.g; a.rc = s.rc; a.err = null;
  if (s.per){ a.per = s.per; delayFromKick(); }
  if (s.ck) a.ck = s.ck;
  if (s.sh) a.sh = s.sh;

}
/* 同步：联网的数字比你记录的多，就补上（标“联网”）；你记录的比较多（联网数据有延迟）就不动。
   联网数据几乎是实时的，你的画面通常慢一些：刚同步到的角球你可能还没看到。所以先等画面追上（画面延迟＋30 秒），
   到时你还没点的才补上；等的期间你自己点了，就不会重复。 */
const SHC = ['sb', 'ss', 'so'];
const recCount = (c, i) => M.ev.reduce((n, e) => n + (e.c === c && e.i === i ? 1 : 0), 0);
const holdWait = () => clamp((myDelay() == null ? 60 : myDelay()) + 30, 20, 600);
function missingFrom(s){
  const a = M.api, cur = curCounts(false), out = [];
  const shots = s.sh && NET.shots !== false;
  if (shots && !a.base) a.base = s.sh.map((x, i) => { const b = {}; for (const c of SHC) b[c] = Math.max(0, x[c] - recCount(c, i)); return b; });
  for (const i of [0, 1]){
    if (s.ck) out.push(['ck', s.ck[i] - cur.ft[i], i]);
    out.push(['sg', s.g[i] - cur.sc[i], i]);
    out.push(['rc', (s.rc[i] || 0) - cur.rc[i], i]);
    if (shots && a.base) for (const c of SHC) out.push([c, s.sh[i][c] - a.base[i][c] - recCount(c, i), i]);

function commitHold(s){
  const a = M.api, added = {};

  const miss = missingFrom(s);
  if (!miss.length) return added;
  const ht = !!M.tm.ht;
  const p = ht ? 1 : M.tm.p, clk = ht ? (M.pe[1] || PER[1][1]) : Math.floor(clockOf(M));
  // 补上的事件平均摆在上次补到画面追上之前，时间轴才不会全挤在同一点
  const now = ht ? clk : Math.max(PER[p][0], clk - 30);
  const o = M.obs || { p: 1, t: 0 };
  let from = a.cp === p && a.ct != null && a.ct <= now ? a.ct : now - 120;
  from = Math.max(from, PER[p][0], o.p === p ? o.t : PER[p][0]);
  for (const [c, n, i] of miss){
    for (let k = 0; k < n; k++) M.ev.push({ t: ht ? now : Math.round(from + (now - from) * (k + 1) / (n + 1)), p, i, c, b: 0, a: 1, aw: Date.now(), k: ++seq });
    const key = `${teamName(i)} ${c === 'sg' ? '进球' : SHC.includes(c) ? '射门' : LABEL[c]}`; added[key] = (added[key] || 0) + n;
  }

function addedMsg(added){ const m = Object.entries(added).map(([k, n]) => `${k} ${n}`); if (m.length) showToast('联网同步补上：' + m.join('，')); }
/* 到时间的暂存就补上（不用再发请求） */
function flushHold(force){
  const a = M.api;
  if (!a || !a.hold || !a.hold.length) return;
  const due = a.hold.filter(h => force || nowSec() >= h.due);
  if (!due.length) return;
  a.hold = a.hold.filter(h => !due.includes(h));
  const added = {};
  for (const h of due) Object.entries(commitHold(h.s)).forEach(([k, n]) => { added[k] = (added[k] || 0) + n; });

}
function applySync(s, manual){
  applySnap(s);

  if (M.st === 1 && isRecording()){
    const miss = missingFrom(s);
    if (miss.length){
      const wait = holdWait();
      a.hold = (a.hold || []).concat([{ due: nowSec() + wait, s: { ck: s.ck, g: s.g, rc: s.rc, sh: s.sh } }]).slice(-4);
      if (manual){
        const ck = s.ck ? `角球 ${s.ck[0]}–${s.ck[1]}（你记录 ${curCounts(false).ft.join('–')}）` : '比分有变化';
        showToast(`联网：${ck}。等画面追上（约 ${fmtDelay(wait)}）还没点的会自动补上`);
      }

/* ---------- 赛前全场预期：两队近 10 场的场均角球（得／失）
   主队预期 =（主队场均得 + 客队场均失）÷ 2，客队同理，两队相加——跟模型训练时用的算法一样。
   联网自动查：每队先拿最近完场的 10 场（各 1 次请求），再用 ids 一次读完这些场的统计（1 次），大约 3 次。 */
async function teamRecent(id){
  let list = [], err = null;
  try { list = await apiGet(`/fixtures?team=${id}&last=10`) || []; } catch(e){ err = e; }
  if (!list.length){  // 有些方案不能用 last：改成拿整个赛季再挑最近完场的
    const d = new Date(), y = d.getFullYear(), s0 = d.getMonth() >= 6 ? y : y - 1;
    for (const season of [...new Set([s0, y])]){
      try { list = list.concat(await apiGet(`/fixtures?team=${id}&season=${season}`) || []); } catch(e){ err = e; }
    }
  }
  const fin = list.filter(f => f && f.fixture && DONE_ST.includes((f.fixture.status || {}).short))
    .sort((a, b) => (b.fixture.timestamp || 0) - (a.fixture.timestamp || 0));
  const seen = new Set(), out = [];
  for (const f of fin){ if (!seen.has(f.fixture.id)){ seen.add(f.fixture.id); out.push(f); } if (out.length >= 10) break; }
  if (!out.length && err) throw err;
  return out;
}
function cornersOf(f, id){
  const st = f && Array.isArray(f.statistics) ? f.statistics : [];
  const me = st.find(x => x && x.team && x.team.id === id), op = st.find(x => x && x.team && x.team.id !== id);
  const v = t => { const s = t && (t.statistics || []).find(x => x.type === 'Corner Kicks'); return s && s.value != null ? parseInt(s.value, 10) || 0 : null; };
  const a = v(me), b = v(op);

}
async function apiForm(){
  const a = M.api;
  if (!a || !a.hid || !a.aid) throw new Error('先连上这场比赛（输入两队名字后会自动查找）');
  const ids = a.sw ? [a.aid, a.hid] : [a.hid, a.aid];  // 你的主队、客队
  const lists = [];
  for (const id of ids) lists.push(await teamRecent(id));
  const all = [...new Set(lists.flat().map(f => f.fixture.id))];
  let stats = {};

    for (let k = 0; k < all.length; k += 20){
      const r = await apiGet(`/fixtures?ids=${all.slice(k, k + 20).join('-')}`) || [];

    case 'defs':
      h = `<div class="card-h"><h3>按键定义</h3><button class="pill" data-a="close">关闭</button></div>
        <p class="hint">按键的定义跟 StatsBomb 的事件数据一致，预测模型就是用这些数据算出来的。记录得越接近这些定义，预测越准。每次点击都用当下的比赛时间；点错了按下方“撤销”，或在“全部事件”里修改。</p>
        <div class="defs">${DEFS.map(([t, x]) => `<div><h4>${t}</h4><p>${x}</p></div>`).join('')}</div>`;
      break;
    case 'model':
      h = `<div class="card-h"><h3>预测模型怎么算</h3><button class="pill" data-a="close">关闭</button></div>
        <div class="defs">
          <div><h4>数据</h4><p>StatsBomb 免费公开的 2015/16 赛季英超、西甲、意甲、法甲全部 1,517 场比赛，每一次传球、带球、射门、角球都有时间和位置。按键就是照这些事件的定义设计的。</p></div>
          <div><h4>基本节奏</h4><p>每队每分钟拿到角球的概率，会随比赛时段、主客场、比分（落后的一方角球多）、人数（少一人角球大减）和“刚拿到角球”而变化。</p></div>
          <div><h4>攻势系数</h4><p>本队进入前场和进入禁区越多，接下来的角球越多；对方进入前场越多，本队的角球越少。传中的影响比较小。这些记录换算成每队一个倍数，乘在基本节奏上。比赛刚开始时记录少，系数会接近 1；记录越多，影响越大。</p></div>

          <div><h4>自动投注（模拟）</h4><p>按“开始自动投注”后，等这场记录满 5 分钟，开始监控画面上现在的大小盘两边和让球两边。任一边的赢盘率连续一段比赛时间（默认 3 分钟，可改 1、2、5 分钟）都在 60%、70% 或 80% 以上，就在那一档记一笔；中间只要掉到档位以下就重新计时。同一个盘口、同一边、同一档每场只记一次；已经确定的盘（例如角球数已经超过大小盘）不记。最后输入实际角球数结算，统计每一档的命中率，不管赔率。</p></div>
          <div><h4>你的记录</h4><p>你结束的比赛越多，“平均”会越来越接近你自己的记录习惯，攻势系数也会跟着校准。${H.n ? `目前已用到你 ${H.n} 场已结束的比赛。` : '目前还没有已结束的比赛。'}</p></div>
          <div><h4>来源</h4><p>模型数据：StatsBomb Open Data（github.com/statsbomb/open-data）。</p></div>
        </div>`;
      break;
  }
  card.innerHTML = h;
}

card.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, d = sheetData;
  switch (a){
    case 'close': closeSheet(); break;
    case 'clock': openClock(); break;
    case 'list': openSheet('list'); break;
    case 'arch': openSheet('arch'); break;

      apiGet('/status').then(r => {
        const x = Array.isArray(r) ? r[0] : r, sub = x && x.subscription, rq = x && x.requests;
        if (rq){ NET.quota = { cur: rq.current, lim: rq.limit_day, t: new Date().toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' }) }; saveNet(); }
        sheetData.msg = `已连上 API-Football${sub ? `：方案 ${sub.plan}${sub.active === false ? '（未启用）' : ''}` : ''}${rq ? `，今天已用 ${rq.current} / ${rq.limit_day} 次` : ''}。`;
      }).catch(e => { sheetData.msg = '测试失败：' + e.message; }).finally(() => { if (sheetKind === 'net'){ renderSheet(); } renderPred(); if (NET.key) scheduleFind(300); });
      break;
    }
    case 'nkey0': NET.key = ''; saveNet(); sheetData.msg = '已清除。'; renderSheet(); renderPred(); break;
    case 'nauto': NET.auto = b.dataset.v === '1'; saveNet(); renderSheet(); break;
    case 'niv': NET.iv = +b.dataset.v; saveNet(); renderSheet(); break;
    case 'ndl0': NET.delay = null; if (M.api){ M.api.dl = null; M.api.dlk = null; } saveNet(); saveNow(); renderSheet(); showToast('已清除画面延迟，下次开球或中途加入时重新测'); break;
    case 'nshot': NET.shots = b.dataset.v === '1'; saveNet(); renderSheet(); break;
    case 'nsync': closeSheet(); apiSync(true); break;
    case 'defs': openSheet('defs'); break;
    case 'nfind': closeSheet(); M.apiNo = null; apiFind(true); break;
    case 'nre': closeSheet(); M.api = null; M.apiNo = null; saveNow(); renderPred(); apiFind(true); break;
    case 'noff': M.api = null; M.apiNo = namesKey(); saveNow(); closeSheet(); renderPred(); showToast('已解除联网连接'); break;
    case 'abhold': AB.hold = +b.dataset.v; LS.set('corner-sb-ab', AB); abTrack = {}; renderSheet(); renderAB(); break;
    case 'msettle': openSettle(b.dataset.id); break;
    case 'ss': { const f = b.dataset.f, i = +b.dataset.i; d[f][i] = clamp(d[f][i] + (+b.dataset.d), 0, 40); renderSheet(); break; }
    case 'sgo': {
      const m = store[d.id] || M, need = needRes(m);
      if (need.h1 && need.ft && (d.ft[0] < d.h1[0] || d.ft[1] < d.h1[1])){ showToast('全场角球不能比上半场少'); break; }
      m.res = { h1: need.h1 ? d.h1.slice() : (m.res && m.res.h1) || null, ft: need.ft ? d.ft.slice() : (m.res && m.res.ft) || null };
      let w = 0, l = 0, pu = 0;
      for (const x of m.ab.bets){ x.r = settleBet(x, m.res); if (x.r === 1) w++; else if (x.r === 0) l++; else if (x.r === 0.5) pu++; }
      store[m.id] = m; saveNow(); closeSheet(); renderAll();
      showToast(`已结算 ${w + l + pu} 笔：命中 ${w}，没中 ${l}${pu ? `，走盘 ${pu}` : ''}`, () => openSheet('abstats'), '看统计');
      break;
    }
    case 'new': closeSheet(); startNew(); break;
    case 'exp1': openExport([M]); break;
    case 'expall': openExport(Object.values(store).filter(m => m.ev.length || m.h || m.a)); break;
    case 'mexp': { const m = store[b.dataset.id]; if (m) openExport([m]); break; }
    case 'msync': syncPast(b.dataset.id); break;
    case 'xfetch': expFetch(); break;
    case 'xuse': {
      M.exp = Math.round(expOf(d.v) * 10) / 10; M.expIn = d.v.slice(); M.expSrc = d.src || null;
      saveNow(); closeSheet(); renderAll(); showToast(`全场预期设为 ${M.exp.toFixed(1)}`); break;
    }
    case 'ppick': pickPast(b.dataset.id, +b.dataset.i); break;
    case 'mopen': { const m = store[b.dataset.id]; if (m){ saveNow(); pauseOther(); M = m; undoStack = []; abTrack = {}; closeSugg(); H = history(); tv.z = 1; tv.off = 0; saveNow(); closeSheet(); renderAll(); syncWake(); } break; }
    case 'mdel': {
      const id = b.dataset.id;
      if (d.del !== id){ sheetData.del = id; renderSheet(); break; }
      delete store[id]; LS.set(KEY, store);
      if (id === M.id){ M = newMatch(); tv.z = 1; tv.off = 0; }
      H = history(); sheetData.del = null; renderSheet(); renderAll(); break;
    }
    case 'finish': {
      const st = finishMatch(); M.ab.on = null; abTrack = {}; saveNow(); H = history(); closeSheet(); renderAll(); syncWake();
      showToast(`已结束记录（记录到 ${fmtClock(st.p, st.t)}）`);
      if (M.ab.bets.some(x => x.r == null)) openSettle(M.id);
      break;
    }
    case 'reopen': M.st = 1; M.stop = null; saveNow(); H = history(); closeSheet(); renderAll(); break;
    case 'join': openJoin(); break;
    case 'js': {
      const f = b.dataset.f, i = +b.dataset.i, p2 = (d.mode === 'join' ? d.tp.p : d.p) === 2;
      d[f][i] = clamp(d[f][i] + (+b.dataset.d), 0, 40);
      if (p2 && f === 'ck1') d.ck1[i] = Math.min(d.ck1[i], d.ft[i]);
      if (p2 && f === 'ft' && d.ck1[i] > d.ft[i]) d.ck1[i] = d.ft[i];
      renderSheet(); break;
    }
    case 'jlk': d.lk = false; d.ck1 = d.ft.slice(); renderSheet(); break;
    case 'jgo': {
      const join = d.mode === 'join';
      if (applyJoin({ mode: d.mode, p: join ? d.tp.p : d.p, v: tpNow(d.tp), sc: d.sc, rc: d.rc, ck1: d.ck1, ft: d.ft, lk: d.lk })){
        closeSheet();
        if (join && d.ht){ endFirstHalf(); saveNow(); syncWake(); renderAll(); showToast('已从中场休息开始记录，下半场开球时按 ▶'); }
        // 你按画面设定的时间跟联网实时的差＝画面延迟，记下来
        if (join && !d.ht && M.api){ learnDelay(clockOf(M), 'join'); saveNow(); }
      }
      break;
    }
    case 'tpp': tpHalf(d.tp, +b.dataset.p); renderSheet(); break;
    case 'tpn': tpSet(d.tp, tpNow(d.tp) + (+b.dataset.d)); tpShow(d.tp); break;
    case 'tpset': {
      const tp = d.tp, first = M.st === 1 && !observed(M).length, v = tpNow(tp);
      M.tm.p = tp.p; setClock(v); M.tm.ht = 0;
      if (first) M.obs = { p: tp.p, t: v };
      if (M.api) learnDelay(clockOf(M), 'set');
      saveNow(); renderAll(); renderSheet();
      if (first) showToast(`已设定为 ${fmtClock(tp.p, v)}，要补录之前的比分和角球吗？`, openJoin, '补录');
      else showToast(`已设定为 ${fmtClock(tp.p, v)}`);
      break;
    }
    case 'kick': kick(+b.dataset.p); saveNow(); syncWake(); renderAll(); renderSheet(); break;
    case 'toggle': M.tm.r ? pauseClock() : startClock(); saveNow(); syncWake(); renderAll(); renderSheet(); break;
    case 'endh': if (M.tm.p === 1){
        endFirstHalf(); saveNow(); syncWake(); renderAll(); renderSheet();
        if (M.ab.bets.some(x => x.mt === 'h1' && x.r == null)) showToast('上半场结束。上半场的自动投注可以结算了', () => openSettle(M.id), '结算');
        else showToast('上半场结束，预测已换成下半场');
      } else showToast('现在已经是下半场'); break;
    case 'nudge': setClock(clockOf(M) + (+b.dataset.d)); if (M.api) learnDelay(clockOf(M), 'set'); saveNow(); renderAll(); renderSheet(); break;
    case 'edit': openSheet('edit', { k: +b.dataset.k }); break;
    case 'eteam': { const e = findEv(d.k); if (e){ e.i = +b.dataset.i; saveNow(); renderAll(); renderSheet(); } break; }
    case 'ecode': { const e = findEv(d.k); if (e){ e.c = b.dataset.c; saveNow(); renderAll(); renderSheet(); } break; }
    case 'etime': { const e = findEv(d.k); if (e){ e.t = Math.max(PER[e.p][0], e.t + (+b.dataset.d)); sortEv(M); saveNow(); renderAll(); renderSheet(); } break; }
    case 'edel': { removeEv(d.k); closeSheet(); showToast('已删除'); break; }
    case 'share': shareFile(); break;
    case 'download': downloadFile(); break;
    case 'copy': copyText(); break;
    case 'file': $('#fileIn').click(); break;
    case 'paste': importText($('#pasteIn').value); break;
  }
});
function pauseOther(){ if (M.tm.r){ pauseClock(); } }
function openJoin(){

  openSheet('join', { mode, p, tp: { p: 1, v: 20 * 60, live: mode === 'join', at: Date.now() }, sc: c.sc.slice(), rc: c.rc.slice(), ck1: c.ck1.slice(), ft: c.ft.slice(), lk: mode === 'join' });
}
function openClock(){
  const p = M.tm.ht ? 2 : M.tm.p, v = M.tm.ht ? PER[2][0] : Math.floor(clockOf(M));
  openSheet('clock', { tp: { p, v: clamp(v, TPR[p][0], TPR[p][1]), live: !!M.tm.r && !M.tm.ht, at: Date.now() } });
}
card.addEventListener('input', ev => {

/* ================= 导出与导入 ================= */
const README = '角球数据记录导出档（fmt=1）。matches 是比赛阵列，每场：id、d 日期、lg 联赛、h 主队、a 客队、st 状态(1进行中/2已结束)、exp 赛前全场角球预期、line 上下半场盘口、add 上下半场补时(分钟，null=默认)、hd 上下半场角球让球(主队，负数=主队让)、pe 各半场结束时的比赛时钟秒数、obs 开始观看的位置{p 半场, t 比赛时钟秒数}、stop 结束记录的位置(未结束为 null)、mk 上下半场预测用的盘(h本半场/f全场)、fl 全场大小盘、fh 全场让球(主队)、ev 事件阵列。只有 obs 到 stop 之间是实际观看的时间。'
  + 'ab.bets 是自动投注（模拟）记录：mt 盘(h1上半场/h2下半场/ft全场)、mk(ou大小/hd让球)、sd(o大/u小/h主/a客)、ln 盘口(让球以主队为准)、pr 投注当下模型的赢盘率、tier 档位(%)、p 与 t 投注时的半场与比赛时钟秒数、hold 需要稳定的秒数、sc 当时比分、ck 当时这个盘已有的角球、r 结果(1命中/0没中/0.5走盘/null待结算)。res 是结算用的最后角球 {h1 上半场[主,客], ft 全场[主,客]}。'
  + '每个事件 = [t 比赛时钟秒数（下半场从2700起算）, p 半场(1上半/2下半), i 队伍(0主队/1客队), c 代码, b(可省略；1=中途加入时补录、时间不详), a(可省略；1=联网同步自动补上的，时间是同步当下)]。api 是联网连上的比赛(API-Football fixture id、两队英文名、sw=1 表示主客跟输入相反、最后同步到的 st 状态/el 分钟/g 比分/ck 角球/ck1 上半场角球/sh 射门、dl 你的画面比实时慢几秒、fin=1 表示赛后同步到了完场数据)。代码与定义见 codes；定义与 StatsBomb Open Data 的事件一致：f3 运动战传球（到人）或带球进入前场三分之一但没进禁区；bx 运动战传球（到人，非传中）或带球从禁区外进入禁区；co/cf 运动战传中到人/没到人；sb/ss/so/sg 射门被挡/被扑/偏出(含中柱)/进球；ck 角球；og 对方乌龙（本队得分）；rc 本队红牌。';
function openExport(list){
  const ds = new Date().toISOString().slice(0, 10);
  const matches = list.map(m => ({ id: m.id, d: m.d, lg: m.lg, h: m.h, a: m.a, st: m.st, exp: m.exp, line: m.line, hd: m.hd, mk: m.mk, fl: m.fl, fh: m.fh, add: m.add, pe: m.pe, obs: m.obs, stop: m.stop,
    ab: { bets: m.ab.bets }, res: m.res, api: m.api, ev: m.ev.map(e => e.a ? [e.t, e.p, e.i, e.c, e.b ? 1 : 0, 1] : e.b ? [e.t, e.p, e.i, e.c, 1] : [e.t, e.p, e.i, e.c]) }));

  if (tv.z > 1.02){
    const a = invContent(g, off), b = invContent(g, off + g.inner);
    zl.textContent = `×${tv.z.toFixed(1)}　${fmtMin(a.p, Math.round(a.t / 60) * 60)}–${fmtMin(b.p, Math.round(b.t / 60) * 60)}`;
  } else zl.textContent = '双指可放大';
  $('#zOut').disabled = tv.z <= 1.001; $('#zAll').disabled = tv.z <= 1.001;
  $('#zNow').hidden = !(info.live && tv.z > 1.02);
}
let tlRaf = 0;
const scheduleTL = () => { if (!tlRaf) tlRaf = requestAnimationFrame(() => { tlRaf = 0; renderTimeline(); }); };
function setZoom(z, fx, focus){
  if (!tlLast) return;
  tv.z = clamp(z, 1, Z_MAX);
  const g = geometry(tlLast.info, tlLast.W, tv.z);
  const c = focus ? contentX(g, focus.p, focus.t) : 0;
  tv.off = clamp(c - (fx - PAD_L), 0, g.maxOff);
  scheduleTL();
}
function focusAt(fx){ return tlLast ? invContent(tlLast.g, fx - PAD_L + tv.off) : null; }
function zoomBy(f){ if (!tlLast) return; const fx = PAD_L + tlLast.g.inner / 2; setZoom(tv.z * f, fx, focusAt(fx)); }
$('#zIn').addEventListener('click', () => zoomBy(1.6));
$('#zOut').addEventListener('click', () => zoomBy(1 / 1.6));
$('#zAll').addEventListener('click', () => { tv.z = 1; tv.off = 0; renderTimeline(); });
$('#zNow').addEventListener('click', () => {
  if (!tlLast) return; const { info, g } = tlLast;
  tv.off = clamp(contentX(g, info.curP, info.clock) - g.inner * 0.8, 0, g.maxOff); renderTimeline();
});
const saveTlPref = () => LS.set('corner-sb-tl', tlPref);
$('#curveBtn').addEventListener('click', () => { tlPref.curve = !tlPref.curve; saveTlPref(); renderLegend(); renderTimeline(); });
$('#tlMore').addEventListener('click', () => { tlPref.full = !tlPref.full; saveTlPref(); renderLegend(); renderTimeline(); });
$('#tlFold').addEventListener('click', () => { tlPref.fold = !tlPref.fold; saveTlPref(); renderLegend(); renderTimeline(); });
$('#lgdBtn').addEventListener('click', () => { tlPref.legend = !tlPref.legend; saveTlPref(); renderLegend(); });
/* 手势：单指左右拖动（含惯性）、双指缩放、点一下打开事件 */
const tg = { pts: new Map(), pan: null, pinch: null, moved: false, vx: 0, lx: 0, lt: 0, inert: 0 };
const local = e => { const r = tlWrap.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
tlWrap.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  cancelAnimationFrame(tg.inert); tg.inert = 0;
  try { tlWrap.setPointerCapture(e.pointerId); } catch(_){}
  const p = local(e); tg.pts.set(e.pointerId, p);
  if (tg.pts.size === 1){ tg.pan = { x: p.x, off: tv.off }; tg.moved = false; tg.vx = 0; tg.lx = p.x; tg.lt = performance.now(); }
  else if (tg.pts.size === 2){
    const [a, b] = [...tg.pts.values()];
    tg.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: tv.z, focus: focusAt((a.x + b.x) / 2) };
    tg.moved = true; tg.pan = null;
  }
});
tlWrap.addEventListener('pointermove', e => {
  if (!tg.pts.has(e.pointerId)) return;
  const p = local(e); tg.pts.set(e.pointerId, p);
  if (tg.pinch && tg.pts.size >= 2){
    const [a, b] = [...tg.pts.values()];
    setZoom(tg.pinch.z * (Math.hypot(a.x - b.x, a.y - b.y) || 1) / tg.pinch.d, (a.x + b.x) / 2, tg.pinch.focus);
    return;
  }
  if (tg.pan){
    const dx = p.x - tg.pan.x;
    if (!tg.moved && Math.abs(dx) > 6){ tg.moved = true; tlWrap.classList.add('drag'); }
    if (tg.moved){
      tv.off = tg.pan.off - dx;
      const now = performance.now(), dt = now - tg.lt;
      if (dt > 0) tg.vx = 0.7 * ((p.x - tg.lx) / dt) + 0.3 * tg.vx;
      tg.lx = p.x; tg.lt = now; scheduleTL();
    }
  }
});
function tlUp(e){
  if (!tg.pts.has(e.pointerId)) return;
  tg.pts.delete(e.pointerId);
  try { tlWrap.releasePointerCapture(e.pointerId); } catch(_){}
  if (tg.pinch){
    if (tg.pts.size < 2){ tg.pinch = null; const rest = [...tg.pts.values()][0]; tg.pan = rest ? { x: rest.x, off: tv.off } : null; tg.lx = rest ? rest.x : 0; tg.lt = performance.now(); tg.vx = 0; }
    return;
  }
  if (tg.pts.size === 0){
    tlWrap.classList.remove('drag');
    tg.wasDrag = tg.moved;
    if (tg.moved && Math.abs(tg.vx) > 0.25 && performance.now() - tg.lt < 90) inertia(tg.vx);
    tg.pan = null;
  }
}
tlWrap.addEventListener('pointerup', tlUp);
tlWrap.addEventListener('pointercancel', tlUp);
tlWrap.addEventListener('click', e => {
  if (tg.wasDrag){ tg.wasDrag = false; return; }
  const p = local(e);
  let best = null, bd = 24 * 24;
  for (const h of tlHeads){ const d = (h.x - p.x) ** 2 + (h.y - p.y) ** 2; if (d < bd){ bd = d; best = h; } }
  if (best) openSheet('edit', { k: best.k });
});
function inertia(v0){
  let v = v0, last = performance.now();
  const step = now => {
    const dt = Math.min(40, now - last); last = now;
    tv.off -= v * dt; v *= Math.pow(0.93, dt / 16);
    const max = tlLast ? tlLast.g.maxOff : 0;
    if (tv.off <= 0 || tv.off >= max){ tv.off = clamp(tv.off, 0, max); v = 0; }
    renderTimeline();
    tg.inert = Math.abs(v) > 0.02 ? requestAnimationFrame(step) : 0;
  };
  tg.inert = requestAnimationFrame(step);
}
tlWrap.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey){ e.preventDefault(); const p = local(e); setZoom(tv.z * Math.exp(-e.deltaY * 0.01), p.x, focusAt(p.x)); return; }
  if (tv.z > 1.001 && Math.abs(e.deltaX) > Math.abs(e.deltaY)){ e.preventDefault(); tv.off += e.deltaX; scheduleTL(); }
}, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => tlWrap.addEventListener(t, e => e.preventDefault()));
let tlW = 0;
new ResizeObserver(() => { const w = Math.round(tlWrap.clientWidth); if (w && w !== tlW){ tlW = w; renderTimeline(); } }).observe(tlWrap);
phoneMQ.addEventListener && phoneMQ.addEventListener('change', () => renderTimeline());
renderLegend();

/* ================= 按钮与更新 ================= */
$('#runBtn').addEventListener('click', () => {
  if (M.st === 2){ showToast('这场已经结束记录了。', startNew, '开始新比赛'); return; }
  if (M.tm.ht){ kick(2); showToast('下半场开球，从 45:00 开始计时'); }
  else M.tm.r ? pauseClock() : startClock();
  saveNow(); syncWake(); renderAll();
});
$('#clkBtn').addEventListener('click', openClock);
$('#menuBtn').addEventListener('click', () => openSheet('menu'));
$('#netPill').addEventListener('click', netPillTap);
$('#defBtn').addEventListener('click', () => openSheet('defs'));
$('#listBtn').addEventListener('click', () => openSheet('list'));
['#glH', '#glA', '#ckH', '#ckA'].forEach(x => $(x).addEventListener('click', openJoin));
$('#undoBtn').addEventListener('click', undoLast);
let lastPred = 0, lastTL = 0;
setInterval(() => {
  tickClock(false);
  if (M.tm.r && Date.now() - lastPred > 10000){ lastPred = Date.now(); renderPred(); renderCounts(); }
  if (M.tm.r && Date.now() - lastTL > 5000 && !tg.pts.size && !tg.inert){ lastTL = Date.now(); renderTimeline(); }
  if (M.api && NET.key && NET.iv > 0 && M.st === 1 && !netBusy && isRecording() && !DONE_ST.includes(M.api.st) && document.visibilityState === 'visible'
    && navigator.onLine !== false && nowSec() - (M.api.at || 0) >= NET.iv) apiSync(false);
  if (M.api && M.api.hold && M.api.hold.length && M.st === 1) flushHold(false);
  if (!sheet.hidden && sheetData && sheetData.tp && sheetData.tp.live) tpShow(sheetData.tp);
}, 500);

let offline = '离线使用：请从主屏幕的图示打开，联网时打开一次后就能离线使用。';
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(() => { offline = '离线使用：已准备好，没有网络也能从主屏幕打开。'; }).catch(() => {});
}
renderAll(); syncWake();
})();
</script>
